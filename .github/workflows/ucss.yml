name: UCSS obnova
on:
  schedule:
    - cron: '23 1 * * *'   # svake noći (UTC)
  workflow_dispatch:
    inputs:
      paths:
        description: 'Putanje za obnovu (npr. "/ /kontakt/"), prazno = sve s popisa na webu'
        required: false
        default: ''
concurrency: { group: ucss, cancel-in-progress: false }
jobs:
  ucss:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install
      - name: Provjera ima li posla
        id: q
        env: { RS_UCSS_TOKEN: '${{ secrets.RS_UCSS_TOKEN }}' }
        run: |
          N=$(curl -s "https://www.redsun.hr/wp-admin/admin-ajax.php?action=rs_ucss_queue&t=$RS_UCSS_TOKEN" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log(Object.keys(j.requests||{}).length+Object.keys(j.stale||{}).length)}catch(e){console.log(1)}})")
          [ -n "${{ github.event.inputs.paths }}" ] && N=1
          echo "n=$N" >> $GITHUB_OUTPUT
      - if: steps.q.outputs.n != '0'
        run: npx playwright install --with-deps chromium
      - if: steps.q.outputs.n != '0'
        env:
          RS_UCSS_TOKEN: '${{ secrets.RS_UCSS_TOKEN }}'
          RS_UCSS_PATHS: '${{ github.event.inputs.paths }}'
        run: node run.js
      - if: always() && steps.q.outputs.n != '0'
        uses: actions/upload-artifact@v4
        with: { name: usporedbe, path: vshots/, if-no-files-found: ignore, retention-days: 7 }
